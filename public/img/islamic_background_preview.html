
<style>
  .preview-section {
    position: relative;
    min-height: 320px;
    overflow: hidden;
    background: linear-gradient(to bottom, #ffffff, #F7F5F0);
    border-radius: 12px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-sans);
  }
  .label {
    position: absolute;
    top: 12px;
    left: 16px;
    font-size: 13px;
    font-weight: 500;
    color: var(--color-text-secondary);
    background: var(--color-background-primary);
    padding: 4px 10px;
    border-radius: 20px;
    border: 0.5px solid var(--color-border-tertiary);
    z-index: 10;
  }
  .mock-card {
    position: relative;
    z-index: 5;
    background: rgba(255,255,255,0.85);
    border-radius: 16px;
    border: 1px solid rgba(201,166,70,0.15);
    padding: 20px 28px;
    width: 280px;
    text-align: center;
  }
  .mock-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-bottom: 1px solid rgba(201,166,70,0.08);
    font-size: 14px;
  }
  .mock-row:last-child { border-bottom: none; }
  .prayer-name { color: #0F3B2E; font-weight: 500; }
  .prayer-time { color: #555; font-family: monospace; }
</style>
